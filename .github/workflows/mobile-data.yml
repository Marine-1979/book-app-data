name: Mobile data build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/materials.json"
      - "data/mobile/**"
      - "scripts/build-mobile-data.mjs"
      - "scripts/validate-mobile-data.mjs"
      - "schema/mobile-app-data.schema.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-mobile-data.mjs
      - run: node scripts/validate-mobile-data.mjs
      - name: Commit generated mobile dataset
        run: |
          if git diff --quiet -- dist/mobile-app-data.json; then exit 0; fi
          git config user.name "book-app-mobile-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/mobile-app-data.json
          git commit -m "chore(mobile): rebuild mobile app data"
          git push
