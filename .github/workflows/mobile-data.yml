name: Mobile data build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mobile-data.yml"
      - "data/materials.json"
      - "data/mobile/**"
      - "scripts/build-mobile-data.mjs"
      - "scripts/validate-mobile-data.mjs"
      - "schema/mobile-app-data.schema.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build mobile dataset
        run: node scripts/build-mobile-data.mjs

      - name: Validate mobile dataset
        run: node scripts/validate-mobile-data.mjs

      - name: Commit generated mobile dataset
        run: |
          git add -f dist/mobile-app-data.json

          if git diff --cached --quiet; then
            echo "No mobile dataset changes to publish."
            exit 0
          fi

          git config user.name "book-app-mobile-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(mobile): rebuild mobile app data"
          git push
