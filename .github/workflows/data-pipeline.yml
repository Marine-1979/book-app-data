name: Validate and publish app data

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/**"
      - ".github/workflows/data-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate source JSON
        run: node scripts/validate-data.mjs

      - name: Validate editorial control
        run: node scripts/build-editorial-status.mjs --validate-only

      - name: Build editorial status
        run: node scripts/build-editorial-status.mjs

      - name: Build one runtime data file
        run: node scripts/build-app-data.mjs

      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet -- dist/app-data.json docs/EDITORIAL_STATUS.md; then
            echo "Generated files are already current."
            exit 0
          fi

          git config user.name "bapp-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/app-data.json docs/EDITORIAL_STATUS.md
          git commit -m "chore(data): rebuild generated outputs"
          git push
